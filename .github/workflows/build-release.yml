name: Build & Release NotebookLM Flashcards SRS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin & Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'obsidian-plugin/package-lock.json'

      - name: Build Obsidian Plugin
        run: |
          cd obsidian-plugin
          npm ci
          npm run build
          zip -r obsidian-notebooklm-flashcards-srs.zip main.js manifest.json styles.css

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./obsidian-plugin/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Commit SHA
        id: commit_sha
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha=$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Upload Obsidian Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-notebooklm-flashcards-srs-v${{ steps.get_version.outputs.version }}
          path: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
            obsidian-plugin/obsidian-notebooklm-flashcards-srs.zip

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebooklm-flashcards-srs-debug-apk-v${{ steps.get_version.outputs.version }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NotebookLM Flashcards SRS Latest Release
          body: |
            Automated build of NotebookLM Flashcards SRS (Obsidian Plugin & Android App).
            
            **Version**: ${{ steps.get_version.outputs.version }}
            **Commit**: ${{ steps.commit_sha.outputs.sha }}
            **Full Commit SHA**: ${{ github.sha }}
            
            ### Included Assets:
            - `main.js`, `manifest.json`, `styles.css` (Obsidian plugin files)
            - `obsidian-notebooklm-flashcards-srs.zip` (Packed plugin release)
            - `app-debug.apk` (Android app debug build)
          draft: false
          prerelease: true
          files: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
            obsidian-plugin/obsidian-notebooklm-flashcards-srs.zip
            android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
